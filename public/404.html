<style>
  :root{--ink:#1f2430;--paper:#f6f3ec;--muted:#646a78;--line:#d9d4c7;--accent:#2f6f6b;--accent-soft:#e3ece9;--card:#fffdf8;font-family:"Pretendard",Inter,system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);line-height:1.65;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px}
  .mark{width:72px;height:72px;margin-bottom:24px}
  .code{font-size:14px;font-weight:700;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;margin-bottom:14px}
  h1{font-size:clamp(26px,5vw,38px);line-height:1.25;letter-spacing:-.02em;font-weight:800}
  p{font-size:clamp(15px,2.2vw,17px);color:var(--muted);margin-top:16px;max-width:42ch}
  .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:30px}
  .btn{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;padding:14px 26px;border-radius:999px;text-decoration:none;border:1px solid transparent;transition:filter .18s,background .18s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-ghost{background:transparent;color:var(--accent);border-color:var(--accent)}
  .btn-ghost:hover{background:var(--accent-soft)}
</style>
