<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>voxpop — 사장님 대시보드</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root {
    --ink: #1f2430;
    --paper: #f6f3ec;
    --muted: #6b7180;
    --line: #d9d4c7;
    --accent: #2f6f6b;
    --acl: #38807b;
    --alert: #b0683a;
    --card: #fffdf8;
    --s2: #f1ede2;
    --canvas: #ece8dc;
    --mint: #7fb3ae;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--canvas);
    color: var(--ink);
    line-height: 1.6;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 32px 24px 80px; }

  /* 헤더 */
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 32px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mark {
    width: 36px; height: 36px;
    background: var(--accent);
    color: var(--paper);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    letter-spacing: -0.04em;
  }
  .brand h1 { font-size: 18px; margin: 0; font-weight: 700; }
  .brand .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .signout {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .signout:hover { color: var(--ink); border-color: var(--muted); }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .guide-link {
    border: 1px solid var(--line);
    color: var(--accent);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    background: var(--card);
  }

  /* 로그인 카드 */
  .signin {
    max-width: 380px;
    margin: 0 auto;
    background: var(--paper);
    border-radius: 12px;
    padding: 36px 28px;
    box-shadow: 0 2px 16px rgba(31, 36, 48, 0.08);
  }
  .signin h2 { font-size: 20px; margin: 0 0 8px; }
  .signin .desc { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .signin input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    background: var(--card);
  }
  .signin input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  .signin .btn {
    width: 100%;
    padding: 12px 16px;
    background: var(--accent);
    color: var(--paper);
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
  }
  .signin .btn:hover { background: var(--acl); }
  .signin .info {
    font-size: 12px;
    color: var(--muted);
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    line-height: 1.7;
  }

  /* 매장 + 응답 영역 */
  .store-info {
    background: var(--paper);
    border-radius: 10px;
    padding: 18px 22px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .store-info .label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .store-info .name { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .store-info .stats { font-size: 13px; color: var(--muted); }
  .store-info .stats b { color: var(--ink); }

  /* 매장 슬라임 (다마고치형 마스코트) */
  .slime-panel {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 24px;
    display: flex;
    align-items: flex-start;
    gap: 18px;
    flex-wrap: wrap;
  }
  .slime-figure {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .slime-sprite {
    /* 표정 시트 3168x1344, 가로 6프레임 → 프레임당 528x1344 (세로형, 마스코트는 위쪽에 위치). */
    /* 폭 64px 기준으로 시트를 비율대로 키우고(384x163), 박스 높이는 마스코트만 보이게 잘라 표시. */
    width: 64px;
    height: 112px;
    background-image: url('../assets/mascot/voxpop-mascot-expressions.png');
    background-repeat: no-repeat;
    background-size: 384px 163px;
    background-position: 0 4px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .slime-stage-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 12px;
  }
  .slime-body { flex: 1 1 260px; min-width: 0; }
  .slime-bubble {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
  }
  .slime-bubble::before {
    content: '';
    position: absolute;
    left: -8px;
    top: 18px;
    width: 14px;
    height: 14px;
    background: var(--card);
    border-left: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    transform: rotate(45deg);
  }
  .slime-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .slime-meta .chip {
    background: var(--s2);
    border-radius: 999px;
    padding: 3px 10px;
  }
  .slime-meta .chip b { color: var(--ink); font-weight: 700; }
  .slime-growth { margin-top: 14px; }
  .slime-growth .gr-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .slime-growth .gr-head b { color: var(--accent); font-weight: 700; font-size: 13px; }
  .slime-bar {
    height: 8px;
    background: var(--s2);
    border-radius: 999px;
    overflow: hidden;
  }
  .slime-bar > span {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.4s ease;
  }

  /* 조치함(성장) 버튼 */
  .resolve-row {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .resolve-btn {
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--paper);
    border-radius: 999px;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .resolve-btn:hover { background: var(--acl); }
  .resolve-btn:disabled {
    background: var(--s2);
    border-color: var(--line);
    color: var(--muted);
    cursor: default;
  }
  .resolve-hint { font-size: 11px; color: var(--muted); }

  /* 섹션 헤더 */
  h2.sec {
    font-size: 15px;
    font-weight: 700;
    margin: 24px 0 12px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  h2.sec .count {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }
  h2.sec .badge-alert {
    background: var(--alert);
    color: var(--paper);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 99px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  /* 응답 카드 */
  .feedback {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 12px;
  }
  .feedback.urgent { border-left: 4px solid var(--alert); background: var(--paper); }
  .feedback.positive { border-left: 4px solid var(--accent); }
  .feedback .meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 99px;
    letter-spacing: 0.04em;
  }
  .badge.high { background: var(--alert); color: var(--paper); }
  .badge.mid { background: #d4a060; color: var(--ink); }
  .badge.low { background: var(--s2); color: var(--muted); }
  .badge.pos { background: var(--accent); color: var(--paper); }
  .badge.neg { background: var(--alert); color: var(--paper); }
  .badge.neu { background: var(--s2); color: var(--muted); }
  .feedback .time {
    font-size: 12px;
    color: var(--muted);
    margin-left: auto;
  }
  .feedback .body {
    font-size: 15px;
    line-height: 1.65;
    color: var(--ink);
    margin: 8px 0;
  }
  .feedback .safety-note {
    margin-top: 8px;
    padding: 10px 12px;
    background: var(--s2);
    border-radius: 4px;
    font-size: 12px;
    color: var(--muted);
  }
  .feedback .flags {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
  }
  .action-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 12px;
  }
  .action-card.urgent { border-left-color: var(--alert); }
  .action-card .line {
    margin: 5px 0;
    font-size: 14px;
  }
  .action-card .line b { color: var(--accent); }
  .action-card.urgent .line b { color: var(--alert); }
  .signal-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .signal-card strong { color: var(--accent); }
  .signal-card .desc {
    margin-top: 4px;
    font-size: 13px;
    color: var(--muted);
  }
  .status-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }
  .status-label {
    font-size: 11px;
    color: var(--muted);
    margin-right: 4px;
  }
  .status-btn {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
    border-radius: 999px;
    padding: 5px 9px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .status-btn:hover { border-color: var(--accent); color: var(--ink); }
  .status-btn.active {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--paper);
  }

  /* 빈 상태 */
  .empty {
    background: var(--paper);
    border-radius: 10px;
    padding: 40px 24px;
    text-align: center;
    color: var(--muted);
  }
  .empty p { margin: 8px 0; }

  /* 알림 */
  .notice {
    padding: 10px 14px;
    background: var(--accent);
    color: var(--paper);
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .notice.error { background: var(--alert); }
</style>
</head>
<body>
<div class="wrap">

  <!-- 로딩 -->
  <div id="loading" class="empty">
    <p>잠시만 기다려주세요...</p>
  </div>

  <!-- 미인증 -->
  <div id="signin-section" class="signin" style="display:none">
    <h2>사장님 대시보드</h2>
    <p class="desc">이메일로 1회용 로그인 링크를 보내드립니다. 비밀번호는 필요 없어요.</p>
    <input type="email" id="email" placeholder="owner@example.com" />
    <button class="btn" id="signin-btn">로그인 링크 받기</button>
    <div id="signin-notice" style="display:none"></div>
    <div class="info">
      이메일은 voxpop에 등록된 사장님 이메일이어야 합니다. 매장 등록 안 됐으면 voxpop 운영자에게 문의해주세요.
      처음이라면 <a href="../owner-guide/">사장님 가이드</a>를 먼저 볼 수 있어요.
    </div>
  </div>

  <!-- 대시보드 -->
  <div id="dashboard" style="display:none">
    <header class="top">
      <div class="brand">
        <div class="mark">v</div>
        <div>
          <h1>voxpop 사장님 대시보드</h1>
          <div class="sub" id="user-email"></div>
        </div>
      </div>
      <div class="header-actions">
        <a class="guide-link" href="../owner-guide/">사장님 가이드</a>
        <button class="signout" id="signout-btn">로그아웃</button>
      </div>
    </header>

    <div id="stores-area"></div>

    <!-- 매장 슬라임 (다마고치형 마스코트) -->
    <div id="slime-panel" class="slime-panel" style="display:none">
      <div class="slime-figure">
        <div id="slime-sprite" class="slime-sprite" role="img" aria-label="매장 슬라임 마스코트"></div>
        <div id="slime-stage-label" class="slime-stage-label"></div>
      </div>
      <div class="slime-body">
        <div id="slime-bubble" class="slime-bubble"></div>
        <div class="slime-meta">
          <span class="chip">기분 <b id="slime-mood"></b></span>
          <span class="chip">건강 <b id="slime-health"></b></span>
          <span class="chip" id="slime-risk-chip" style="display:none">확인 먼저 <b id="slime-risk"></b>건</span>
        </div>
        <div class="slime-growth">
          <div class="gr-head">
            <span>성장 단계 <b id="slime-stagename"></b></span>
            <span id="slime-growth-note"></span>
          </div>
          <div class="slime-bar"><span id="slime-bar-fill" style="width:0%"></span></div>
        </div>
      </div>
    </div>

    <h2 class="sec">긴급 확인 <span class="count" id="urgent-count"></span> <span class="badge-alert" id="urgent-badge" style="display:none">긴급</span></h2>
    <div id="urgent-list"></div>

    <h2 class="sec">오늘 볼 것</h2>
    <div id="today-action"></div>

    <h2 class="sec">반복 신호 <span class="count" id="repeat-count"></span></h2>
    <div id="repeat-list"></div>

    <h2 class="sec">새 한마디 <span class="count" id="new-count"></span></h2>
    <div id="new-list"></div>

    <h2 class="sec">좋은 한마디 <span class="count" id="positive-count"></span></h2>
    <div id="positive-list"></div>

    <h2 class="sec">처리 기록 <span class="count" id="history-count"></span></h2>
    <div id="history-list"></div>
  </div>

</div>

<script type="module">
  import {
    sendMagicLink,
    getCurrentSession,
    signOut,
    fetchOwnerStores,
    fetchOwnerFeedback,
    fetchStoreActions,
    insertStoreAction,
    fetchStoreSlime,
    upsertStoreSlime,
  } from '../lib/supabase-client.js';
  import {
    buildSlimeState,
    slimeBubble,
    growthFromPoints,
    growthGateOpen,
    computeHealth,
    applyKAnon,
  } from '../lib/slime-engine.js';

  const $ = (sel) => document.querySelector(sel);
  // 표정 6프레임 시트 순서 (manifest expressions.map) — buildSlimeState.expression → 프레임 인덱스
  const EXPRESSION_FRAME = { idle: 0, happy: 1, playful: 2, sassy: 3, hungry: 4, sick: 5 };
  const EXPRESSION_FRAMES = 6;
  // 슬라임 상태 (현재 매장 1곳 기준 — 베타 카페 교두보)
  let slimeStoreId = null;
  let slimeActions = [];
  let slimeRow = null;
  const OWNER_STATUS_KEY = 'voxpop-owner-status-v1';
  const OWNER_STATUSES = {
    new: '새 한마디',
    seen: '확인함',
    acted: '조치함',
    later: '나중에 볼 것',
  };
  let currentStores = [];
  let currentFeedback = [];

  function showSection(id) {
    ['loading', 'signin-section', 'dashboard'].forEach((s) => {
      $(`#${s}`).style.display = (s === id) ? '' : 'none';
    });
  }

  function showSigninNotice(message, isError) {
    const el = $('#signin-notice');
    el.className = isError ? 'notice error' : 'notice';
    el.textContent = message;
    el.style.display = '';
  }

  function formatTime(iso) {
    const d = new Date(iso);
    const now = new Date();
    const diffMs = now - d;
    const diffMin = Math.floor(diffMs / 60000);
    if (diffMin < 1) return '방금';
    if (diffMin < 60) return `${diffMin}분 전`;
    const diffHr = Math.floor(diffMin / 60);
    if (diffHr < 24) return `${diffHr}시간 전`;
    const diffDay = Math.floor(diffHr / 24);
    if (diffDay < 7) return `${diffDay}일 전`;
    return d.toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' });
  }

  function sentimentBadge(score) {
    if (score == null) return { cls: 'neu', label: '중립' };
    if (score >= 0.3) return { cls: 'pos', label: '긍정' };
    if (score <= -0.3) return { cls: 'neg', label: '부정' };
    return { cls: 'neu', label: '중립' };
  }

  function urgencyBadge(urgency) {
    if (urgency === 'high') return { cls: 'high', label: '긴급' };
    if (urgency === 'mid' || urgency === 'medium') return { cls: 'mid', label: '주의' };
    return { cls: 'low', label: '평이' };
  }

  function loadOwnerStatusMap() {
    try {
      return JSON.parse(localStorage.getItem(OWNER_STATUS_KEY) || '{}');
    } catch {
      return {};
    }
  }

  function saveOwnerStatusMap(map) {
    localStorage.setItem(OWNER_STATUS_KEY, JSON.stringify(map));
  }

  function getOwnerStatus(item) {
    return item.owner_status || loadOwnerStatusMap()[item.id] || 'new';
  }

  function setOwnerStatus(id, status) {
    const map = loadOwnerStatusMap();
    map[id] = status;
    saveOwnerStatusMap(map);
    currentFeedback = currentFeedback.map((item) => (
      item.id === id ? { ...item, owner_status: status } : item
    ));
    renderDashboard(currentStores, currentFeedback);
  }

  function getCategories(item) {
    if (Array.isArray(item.categories)) return item.categories.filter(Boolean);
    if (typeof item.categories === 'string' && item.categories.trim()) return [item.categories.trim()];
    return ['기타'];
  }

  function primaryCategory(item) {
    return getCategories(item)[0] || '기타';
  }

  function isUrgentFeedback(item) {
    return item.urgency === 'high' || (item.sentiment_score != null && item.sentiment_score <= -0.5);
  }

  function isPositiveFeedback(item) {
    if (item.sentiment_score != null) return item.sentiment_score >= 0.3;
    return /좋|맛있|친절|감사|만족|최고|추천|또\s*갈|다시\s*올/.test(item.content_clean || '');
  }

  function isNegativeFeedback(item) {
    if (item.sentiment_score != null) return item.sentiment_score <= -0.3;
    return /아쉽|불편|별로|늦|더럽|비싸|불친절|맛없|차갑|짜|시끄|불만|기다/.test(item.content_clean || '');
  }

  function isOpenFeedback(item) {
    return !['seen', 'acted'].includes(getOwnerStatus(item));
  }

  function renderStatusControls(item) {
    const current = getOwnerStatus(item);
    return `
      <div class="status-row">
        <span class="status-label">처리 상태: ${OWNER_STATUSES[current] || OWNER_STATUSES.new}</span>
        ${Object.entries(OWNER_STATUSES).map(([key, label]) => `
          <button type="button" class="status-btn ${current === key ? 'active' : ''}" data-status="${key}">
            ${label}
          </button>
        `).join('')}
      </div>
    `;
  }

  function renderFeedback(item) {
    const sb = sentimentBadge(item.sentiment_score);
    const ub = urgencyBadge(item.urgency);
    const isUrgent = isUrgentFeedback(item);
    const cls = isUrgent ? 'feedback urgent' : (sb.cls === 'pos' ? 'feedback positive' : 'feedback');

    const div = document.createElement('div');
    div.className = cls;

    const flagsHtml = [];
    if (item.pii_removed) flagsHtml.push('개인정보 가림');
    if (item.profanity_removed) flagsHtml.push('욕설 가림');
    const flagsLine = flagsHtml.length ? `<div class="flags">${flagsHtml.join(' · ')}</div>` : '';
    const safetyNote = item.content_raw && item.content_raw !== item.content_clean
      ? '<div class="safety-note">가리기 전 원본은 안전을 위해 사장님 화면에 노출하지 않아요. 필요한 신호만 가린 문장과 상태로 보여드립니다.</div>'
      : '';

    const cats = getCategories(item);
    const catsBadges = cats.map((c) => `<span class="badge low">${c}</span>`).join('');

    // 위험·부정 한마디에 "조치함(성장)" 버튼 — 슬라임 건강·성장과 연동
    const showResolve = slimeStoreId
      && item.stores?.id === slimeStoreId
      && (isUrgent || isNegativeFeedback(item));
    const alreadyResolved = getOwnerStatus(item) === 'acted';
    const resolveHtml = showResolve ? `
      <div class="resolve-row">
        <button type="button" class="resolve-btn" data-resolve="1" ${alreadyResolved ? 'disabled' : ''}>
          ${alreadyResolved ? '조치 완료' : '조치함 (성장)'}
        </button>
        <span class="resolve-hint">${alreadyResolved
          ? '슬라임 건강에 반영됐어요.'
          : '확인하고 다뤘다면 눌러주세요. 가게가 건강하면 슬라임이 자랍니다.'}</span>
      </div>
    ` : '';

    div.innerHTML = `
      <div class="meta">
        <span class="badge ${ub.cls}">${ub.label}</span>
        <span class="badge ${sb.cls}">${sb.label}</span>
        ${catsBadges}
        <span class="time">${formatTime(item.created_at)}</span>
      </div>
      <div class="body">${escapeHtml(item.content_clean)}</div>
      ${safetyNote}
      ${flagsLine}
      ${renderStatusControls(item)}
      ${resolveHtml}
    `;

    div.querySelectorAll('.status-btn').forEach((btn) => {
      btn.addEventListener('click', () => setOwnerStatus(item.id, btn.dataset.status));
    });
    const resolveBtn = div.querySelector('[data-resolve]');
    if (resolveBtn && !alreadyResolved) {
      resolveBtn.addEventListener('click', () => handleResolve(item, resolveBtn));
    }

    return div;
  }

  function buildRepeatSignals(feedback) {
    const groups = new Map();
    feedback.filter(isOpenFeedback).forEach((item) => {
      const category = primaryCategory(item);
      const current = groups.get(category) || { category, count: 0, lowCount: 0, latestAt: item.created_at };
      current.count += 1;
      if (isNegativeFeedback(item) || item.urgency === 'high') current.lowCount += 1;
      if (new Date(item.created_at) > new Date(current.latestAt)) current.latestAt = item.created_at;
      groups.set(category, current);
    });
    return Array.from(groups.values())
      .filter((group) => group.count >= 2)
      .sort((a, b) => {
        const aStrong = a.count >= 3 || a.lowCount >= 2 ? 1 : 0;
        const bStrong = b.count >= 3 || b.lowCount >= 2 ? 1 : 0;
        if (bStrong !== aStrong) return bStrong - aStrong;
        if (b.count !== a.count) return b.count - a.count;
        return new Date(b.latestAt) - new Date(a.latestAt);
      });
  }

  function buildTodayAction(feedback) {
    const open = feedback.filter(isOpenFeedback);
    const urgent = open.find(isUrgentFeedback);
    if (urgent) {
      return {
        kind: 'urgent',
        item: urgent,
        title: '고객 주장 기준 긴급 신호 확인',
        reason: `${primaryCategory(urgent)} 관련 한마디가 긴급 확인으로 들어왔어요.`,
        next: '실제 상황이 있었는지 먼저 확인하고, 확인 후 조치함으로 바꿔주세요.',
      };
    }

    const repeated = buildRepeatSignals(open)[0];
    if (repeated) {
      return {
        kind: 'repeat',
        title: `${repeated.category} 반복 신호 확인`,
        reason: `같은 주제 한마디가 ${repeated.count}건 들어왔어요.`,
        next: '오늘 현장에서 같은 문제가 반복될 수 있는 지점 1곳만 확인해보세요.',
      };
    }

    const low = open.find(isNegativeFeedback);
    if (low) {
      return {
        kind: 'low',
        item: low,
        title: `${primaryCategory(low)} 한마디 1건 확인`,
        reason: '아직 반복은 아니지만 그냥 넘기기 아쉬운 신호예요.',
        next: '원문을 읽고 오늘 바로 확인할 수 있는 작은 지점만 봐주세요.',
      };
    }

    const positive = open.find(isPositiveFeedback);
    if (positive) {
      return {
        kind: 'positive',
        item: positive,
        title: '좋은 한마디 확인',
        reason: '지금은 고칠 신호보다 유지하면 좋은 경험이 먼저 보여요.',
        next: '좋았던 지점을 유지할 수 있게 오늘 한 번만 체크해보세요.',
      };
    }

    return {
      kind: 'empty',
      title: '오늘은 억지 액션을 만들지 않아도 돼요',
      reason: '아직 충분한 근거가 없어요.',
      next: '새 한마디가 들어오면 여기에서 먼저 보여드릴게요.',
    };
  }

  function renderTodayAction(feedback) {
    const action = buildTodayAction(feedback);
    const div = document.createElement('div');
    div.className = `action-card ${action.kind === 'urgent' ? 'urgent' : ''}`;
    div.innerHTML = `
      <div class="line"><b>오늘 볼 것:</b> ${escapeHtml(action.title)}</div>
      <div class="line"><b>근거:</b> ${escapeHtml(action.reason)}</div>
      <div class="line"><b>다음:</b> ${escapeHtml(action.next)}</div>
    `;
    return div;
  }

  function renderRepeatSignals(feedback) {
    const repeatList = $('#repeat-list');
    // k-anonymity — 소표본(3건 미만) 슬라이스는 정확 수치를 가려 재식별을 막는다(spec 성공기준).
    const repeats = applyKAnon(buildRepeatSignals(feedback), 3, 'count');
    $('#repeat-count').textContent = repeats.length ? `(${repeats.length})` : '';
    repeatList.innerHTML = '';
    if (!repeats.length) {
      repeatList.innerHTML = `<div class="empty"><p>아직 반복 신호는 없어요.</p><p>같은 주제가 충분히 쌓이면 여기 보여드릴게요.</p></div>`;
      return;
    }
    repeats.forEach((signal) => {
      const hidden = signal.hidden;
      const strong = !hidden && (signal.count >= 3 || signal.lowCount >= 2);
      const div = document.createElement('div');
      div.className = 'signal-card';
      div.innerHTML = `
        <strong>${escapeHtml(signal.category)}</strong> ${hidden ? '소수 신호' : strong ? '강한 반복 신호' : '반복 신호'}
        <div class="desc">${hidden ? '아직 소수라 정확한 수치는 가립니다(소표본 보호). 더 쌓이면 보여드릴게요.' : `같은 주제 ${signal.count}건${signal.lowCount ? ` · 낮은 신호 ${signal.lowCount}건` : ''}. 확정 문제가 아니라 확인할 신호로 봅니다.`}</div>
      `;
      repeatList.appendChild(div);
    });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, (m) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[m]);
  }

  // ── 슬라임 어댑터 ──────────────────────────────────────────
  // Supabase feedback row → slimeEngine item 구조 변환.
  // slimeEngine은 vocEngine processFeedback 결과
  //   {submission:{id,rating,category,submittedAt}, moderation:{includeInStats,urgentAlert}, insight:{reviewRiskLevel}}
  // 를 기대한다. Supabase feedback에는 rating 컬럼이 없으므로(urgency·sentiment_score 중심)
  // 기존 owner가 쓰는 신호(urgency·sentiment_score)를 그대로 매핑한다. 새 수치를 지어내지 않는다.
  function toSlimeItem(item) {
    const urgent = item.urgency === 'high';
    const negative = isNegativeFeedback(item);
    const positive = isPositiveFeedback(item);

    // rating은 slimeEngine의 기분 집계(>=4 칭찬·<=2 불만)에만 쓰인다.
    // 기존 owner의 sentiment 판정(긍정/부정/중립)을 그대로 옮긴다.
    let rating = 3;
    if (positive) rating = 5;
    else if (negative) rating = 2;

    // reviewRiskLevel — 기존 isUrgentFeedback 기준과 정렬.
    let reviewRiskLevel = 'low';
    if (urgent || (item.sentiment_score != null && item.sentiment_score <= -0.5)) {
      reviewRiskLevel = 'high';
    } else if (item.urgency === 'mid' || item.urgency === 'medium' || negative) {
      reviewRiskLevel = 'medium';
    }

    return {
      submission: {
        id: item.id,
        rating,
        category: primaryCategory(item),
        submittedAt: item.created_at,
      },
      moderation: {
        // Supabase에 저장된 응답은 서버에서 이미 가림·검수를 거쳐 노출 중이므로 통계 포함.
        includeInStats: true,
        urgentAlert: urgent,
      },
      insight: { reviewRiskLevel },
    };
  }

  // 현재 매장(1곳)에 해당하는 feedback만 slime item으로
  function slimeItemsFor(storeId, feedback) {
    return feedback
      .filter((f) => !storeId || f.stores?.id === storeId)
      .map(toSlimeItem);
  }

  // buildOwnerDashboard 요약을 slimeBubble이 읽는 최소 형태로 — 기존 owner의 "오늘 볼 것"을 재사용
  function dashboardForBubble(feedback) {
    const items = slimeItemsFor(slimeStoreId, feedback);
    if (items.length === 0) return { state: 'empty' };
    const action = buildTodayAction(feedback.filter((f) => !slimeStoreId || f.stores?.id === slimeStoreId));
    return {
      state: 'normal',
      todayAction: action && action.kind !== 'empty' ? action.title : '',
    };
  }

  function renderSlime(feedback) {
    const panel = $('#slime-panel');
    if (!slimeStoreId) { panel.style.display = 'none'; return; }
    panel.style.display = '';

    const items = slimeItemsFor(slimeStoreId, feedback);
    const state = buildSlimeState(items, slimeActions, slimeRow || {});

    // 표정 프레임 — background-position
    const frame = EXPRESSION_FRAME[state.expression] ?? 0;
    const sprite = $('#slime-sprite');
    const pct = EXPRESSION_FRAMES > 1 ? (frame / (EXPRESSION_FRAMES - 1)) * 100 : 0;
    sprite.style.backgroundPosition = `${pct}% 0`;
    sprite.setAttribute('aria-label', `매장 슬라임 — ${state.stageName}, 기분 ${moodLabel(state.mood)}`);

    // 말풍선
    $('#slime-bubble').textContent = slimeBubble(dashboardForBubble(feedback), state);

    // 메타 (기분·건강·미조치 위험)
    $('#slime-mood').textContent = moodLabel(state.mood);
    $('#slime-health').textContent = `${state.health}점`;
    const riskChip = $('#slime-risk-chip');
    if (state.unresolvedRisk > 0) {
      riskChip.style.display = '';
      $('#slime-risk').textContent = state.unresolvedRisk;
    } else {
      riskChip.style.display = 'none';
    }

    // 성장 단계 + 진척 바
    $('#slime-stage-label').textContent = state.stageName;
    $('#slime-stagename').textContent = state.stageName;
    $('#slime-bar-fill').style.width = `${Math.round(state.growthProgress * 100)}%`;
    $('#slime-growth-note').textContent = state.isMaxStage
      ? '최고 단계까지 키웠어요'
      : `다음 단계까지 ${Math.round(state.growthProgress * 100)}%`;
  }

  function moodLabel(mood) {
    return ({
      happy: '좋음', calm: '평온', worried: '주의', hungry: '한마디 기다리는 중',
    })[mood] || '평온';
  }

  // "조치함" — 한마디를 다뤘다고 기록. 건강 양호일 때만 성장 누적.
  async function handleResolve(item, btn) {
    if (!slimeStoreId) return;
    btn.disabled = true;
    btn.textContent = '기록 중…';
    try {
      // 1) 조치 기록 추가
      const action = await insertStoreAction(slimeStoreId, item.id, 'resolved');
      slimeActions = [action, ...slimeActions];

      // 2) 새 actions로 건강 재계산
      const items = slimeItemsFor(slimeStoreId, currentFeedback);
      const health = computeHealth(items, slimeActions);

      // 3) 건강 게이트 통과 시에만 성장 1포인트 누적
      if (growthGateOpen(health.score)) {
        const prevPoints = slimeRow?.growth_points ?? 0;
        const prevStage = slimeRow?.stage ?? 0;
        const nextPoints = prevPoints + 1;
        const grown = growthFromPoints(nextPoints, prevStage);
        slimeRow = await upsertStoreSlime(slimeStoreId, nextPoints, grown.stage);
      }

      // 4) 처리 상태도 '조치함'으로 동기화 (기존 처리 기록 흐름과 일관)
      setOwnerStatus(item.id, 'acted'); // renderDashboard 재호출 → renderSlime 포함
    } catch (err) {
      console.error('resolve error', err);
      btn.disabled = false;
      btn.textContent = '조치함 (성장)';
    }
  }

  function renderDashboard(stores, feedback) {
    currentStores = stores;
    currentFeedback = feedback;

    const storesArea = $('#stores-area');
    if (stores.length === 0) {
      storesArea.innerHTML = `<div class="empty"><p>아직 등록된 매장이 없습니다.</p><p>voxpop 운영자에게 매장 등록을 문의해주세요.</p></div>`;
    } else {
      storesArea.innerHTML = stores.map((s) => {
        const myFeedback = feedback.filter((f) => f.stores?.id === s.id);
        return `
          <div class="store-info">
            <div>
              <div class="label">매장</div>
              <div class="name">${escapeHtml(s.display_name)}</div>
            </div>
            <div class="stats">
              받은 한마디 <b>${myFeedback.length}</b>개
            </div>
          </div>
        `;
      }).join('');
    }

    const openFeedback = feedback.filter(isOpenFeedback);
    const urgent = openFeedback.filter(isUrgentFeedback);
    $('#urgent-count').textContent = urgent.length ? `(${urgent.length})` : '';
    $('#urgent-badge').style.display = urgent.length ? '' : 'none';
    const urgentList = $('#urgent-list');
    urgentList.innerHTML = '';
    if (urgent.length === 0) {
      urgentList.innerHTML = `<div class="empty"><p>긴급한 한마디는 없어요.</p></div>`;
    } else {
      urgent.forEach((item) => urgentList.appendChild(renderFeedback(item)));
    }

    const todayAction = $('#today-action');
    todayAction.innerHTML = '';
    todayAction.appendChild(renderTodayAction(feedback));

    renderRepeatSignals(feedback);

    const newList = $('#new-list');
    $('#new-count').textContent = openFeedback.length ? `(${openFeedback.length})` : '';
    newList.innerHTML = '';
    if (openFeedback.length === 0) {
      newList.innerHTML = `<div class="empty"><p>새로 볼 한마디는 없어요.</p></div>`;
    } else {
      openFeedback.forEach((item) => newList.appendChild(renderFeedback(item)));
    }

    const positive = feedback.filter(isPositiveFeedback).slice(0, 5);
    $('#positive-count').textContent = positive.length ? `(${positive.length})` : '';
    const positiveList = $('#positive-list');
    positiveList.innerHTML = '';
    if (positive.length === 0) {
      positiveList.innerHTML = `<div class="empty"><p>아직 좋은 한마디는 없어요.</p></div>`;
    } else {
      positive.forEach((item) => positiveList.appendChild(renderFeedback(item)));
    }

    const history = feedback.filter((item) => ['seen', 'acted'].includes(getOwnerStatus(item)));
    $('#history-count').textContent = history.length ? `(${history.length})` : '';
    const historyList = $('#history-list');
    historyList.innerHTML = '';
    if (history.length === 0) {
      historyList.innerHTML = `<div class="empty"><p>아직 처리한 기록은 없어요.</p></div>`;
    } else {
      history.forEach((item) => historyList.appendChild(renderFeedback(item)));
    }

    renderSlime(feedback);
  }

  async function loadDashboard() {
    try {
      const session = await getCurrentSession();
      if (!session) {
        showSection('signin-section');
        return;
      }

      $('#user-email').textContent = session.user.email;

      const [stores, feedback] = await Promise.all([
        fetchOwnerStores(),
        fetchOwnerFeedback(),
      ]);

      // 슬라임 — 현재 매장 1곳(베타 카페 교두보) 기준으로 actions·성장값 로드
      slimeStoreId = stores[0]?.id ?? null;
      if (slimeStoreId) {
        try {
          const [actions, row] = await Promise.all([
            fetchStoreActions(slimeStoreId),
            fetchStoreSlime(slimeStoreId),
          ]);
          slimeActions = actions || [];
          slimeRow = row || null;
        } catch (slimeErr) {
          // 슬라임 데이터 실패는 대시보드 본체를 막지 않는다(추가 기능)
          console.warn('slime load failed', slimeErr);
          slimeActions = [];
          slimeRow = null;
        }
      }

      renderDashboard(stores, feedback);
      showSection('dashboard');
    } catch (err) {
      console.error('dashboard error', err);
      showSection('signin-section');
      showSigninNotice('대시보드를 불러오지 못했어요. 다시 로그인해주세요.', true);
    }
  }

  $('#signin-btn').addEventListener('click', async () => {
    const email = $('#email').value.trim();
    if (!email || !email.includes('@')) {
      showSigninNotice('올바른 이메일 주소를 입력해주세요.', true);
      return;
    }
    try {
      const redirectTo = location.origin + location.pathname;
      await sendMagicLink(email, redirectTo);
      showSigninNotice('로그인 링크를 보냈어요. 이메일을 확인해주세요.', false);
    } catch (err) {
      console.error('magic link error', err);
      showSigninNotice('로그인 링크 발송 실패. 잠시 후 다시 시도해주세요.', true);
    }
  });

  $('#signout-btn').addEventListener('click', async () => {
    await signOut();
    location.reload();
  });

  loadDashboard();
</script>
</body>
</html>
