<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>voxpop — 사장님 대시보드</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root {
    --ink: #1f2430;
    --paper: #f6f3ec;
    --muted: #6b7180;
    --line: #d9d4c7;
    --accent: #2f6f6b;
    --acl: #38807b;
    --alert: #b0683a;
    --card: #fffdf8;
    --s2: #f1ede2;
    --canvas: #ece8dc;
    --mint: #7fb3ae;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--canvas);
    color: var(--ink);
    line-height: 1.6;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 32px 24px 80px; }

  /* 헤더 */
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 32px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mark {
    width: 36px; height: 36px;
    background: var(--accent);
    color: var(--paper);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    letter-spacing: -0.04em;
  }
  .brand h1 { font-size: 18px; margin: 0; font-weight: 700; }
  .brand .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .signout {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .signout:hover { color: var(--ink); border-color: var(--muted); }

  /* 로그인 카드 */
  .signin {
    max-width: 380px;
    margin: 0 auto;
    background: var(--paper);
    border-radius: 12px;
    padding: 36px 28px;
    box-shadow: 0 2px 16px rgba(31, 36, 48, 0.08);
  }
  .signin h2 { font-size: 20px; margin: 0 0 8px; }
  .signin .desc { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .signin input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    background: var(--card);
  }
  .signin input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  .signin .btn {
    width: 100%;
    padding: 12px 16px;
    background: var(--accent);
    color: var(--paper);
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
  }
  .signin .btn:hover { background: var(--acl); }
  .signin .info {
    font-size: 12px;
    color: var(--muted);
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    line-height: 1.7;
  }

  /* 매장 + 응답 영역 */
  .store-info {
    background: var(--paper);
    border-radius: 10px;
    padding: 18px 22px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .store-info .label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .store-info .name { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .store-info .stats { font-size: 13px; color: var(--muted); }
  .store-info .stats b { color: var(--ink); }

  /* 섹션 헤더 */
  h2.sec {
    font-size: 15px;
    font-weight: 700;
    margin: 24px 0 12px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  h2.sec .count {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }
  h2.sec .badge-alert {
    background: var(--alert);
    color: var(--paper);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 99px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  /* 응답 카드 */
  .feedback {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 12px;
  }
  .feedback.urgent { border-left: 4px solid var(--alert); background: var(--paper); }
  .feedback.positive { border-left: 4px solid var(--accent); }
  .feedback .meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 99px;
    letter-spacing: 0.04em;
  }
  .badge.high { background: var(--alert); color: var(--paper); }
  .badge.mid { background: #d4a060; color: var(--ink); }
  .badge.low { background: var(--s2); color: var(--muted); }
  .badge.pos { background: var(--accent); color: var(--paper); }
  .badge.neg { background: var(--alert); color: var(--paper); }
  .badge.neu { background: var(--s2); color: var(--muted); }
  .feedback .time {
    font-size: 12px;
    color: var(--muted);
    margin-left: auto;
  }
  .feedback .body {
    font-size: 15px;
    line-height: 1.65;
    color: var(--ink);
    margin: 8px 0;
  }
  .feedback .raw-toggle {
    margin-top: 8px;
    background: none;
    border: 1px dashed var(--line);
    color: var(--muted);
    padding: 4px 10px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .feedback .raw-toggle:hover { color: var(--ink); }
  .feedback .raw {
    margin-top: 8px;
    padding: 10px 12px;
    background: var(--s2);
    border-radius: 4px;
    font-size: 13px;
    color: var(--tm, var(--ink));
    display: none;
  }
  .feedback .raw.show { display: block; }
  .feedback .flags {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
  }

  /* 빈 상태 */
  .empty {
    background: var(--paper);
    border-radius: 10px;
    padding: 40px 24px;
    text-align: center;
    color: var(--muted);
  }
  .empty p { margin: 8px 0; }

  /* 알림 */
  .notice {
    padding: 10px 14px;
    background: var(--accent);
    color: var(--paper);
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .notice.error { background: var(--alert); }
</style>
</head>
<body>
<div class="wrap">

  <!-- 로딩 -->
  <div id="loading" class="empty">
    <p>잠시만 기다려주세요...</p>
  </div>

  <!-- 미인증 -->
  <div id="signin-section" class="signin" style="display:none">
    <h2>사장님 대시보드</h2>
    <p class="desc">이메일로 1회용 로그인 링크를 보내드립니다. 비밀번호는 필요 없어요.</p>
    <input type="email" id="email" placeholder="hanheejung@example.com" />
    <button class="btn" id="signin-btn">로그인 링크 받기</button>
    <div id="signin-notice" style="display:none"></div>
    <div class="info">
      이메일은 voxpop에 등록된 사장님 이메일이어야 합니다. 매장 등록 안 됐으면 voxpop 운영자에게 문의해주세요.
    </div>
  </div>

  <!-- 대시보드 -->
  <div id="dashboard" style="display:none">
    <header class="top">
      <div class="brand">
        <div class="mark">v</div>
        <div>
          <h1>voxpop 사장님 대시보드</h1>
          <div class="sub" id="user-email"></div>
        </div>
      </div>
      <button class="signout" id="signout-btn">로그아웃</button>
    </header>

    <div id="stores-area"></div>

    <h2 class="sec">오늘 액션 <span class="count" id="urgent-count"></span> <span class="badge-alert" id="urgent-badge" style="display:none">긴급</span></h2>
    <div id="urgent-list"></div>

    <h2 class="sec">전체 한마디 <span class="count" id="all-count"></span></h2>
    <div id="all-list"></div>
  </div>

</div>

<script type="module">
  import {
    sendMagicLink,
    getCurrentSession,
    signOut,
    fetchOwnerStores,
    fetchOwnerFeedback,
  } from '../lib/supabase-client.js';

  const $ = (sel) => document.querySelector(sel);

  function showSection(id) {
    ['loading', 'signin-section', 'dashboard'].forEach((s) => {
      $(`#${s}`).style.display = (s === id) ? '' : 'none';
    });
  }

  function showSigninNotice(message, isError) {
    const el = $('#signin-notice');
    el.className = isError ? 'notice error' : 'notice';
    el.textContent = message;
    el.style.display = '';
  }

  function formatTime(iso) {
    const d = new Date(iso);
    const now = new Date();
    const diffMs = now - d;
    const diffMin = Math.floor(diffMs / 60000);
    if (diffMin < 1) return '방금';
    if (diffMin < 60) return `${diffMin}분 전`;
    const diffHr = Math.floor(diffMin / 60);
    if (diffHr < 24) return `${diffHr}시간 전`;
    const diffDay = Math.floor(diffHr / 24);
    if (diffDay < 7) return `${diffDay}일 전`;
    return d.toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' });
  }

  function sentimentBadge(score) {
    if (score == null) return { cls: 'neu', label: '중립' };
    if (score >= 0.3) return { cls: 'pos', label: '긍정' };
    if (score <= -0.3) return { cls: 'neg', label: '부정' };
    return { cls: 'neu', label: '중립' };
  }

  function urgencyBadge(urgency) {
    if (urgency === 'high') return { cls: 'high', label: '긴급' };
    if (urgency === 'mid') return { cls: 'mid', label: '주의' };
    return { cls: 'low', label: '평이' };
  }

  function renderFeedback(item) {
    const sb = sentimentBadge(item.sentiment_score);
    const ub = urgencyBadge(item.urgency);
    const isUrgent = item.urgency === 'high' || (item.sentiment_score != null && item.sentiment_score <= -0.5);
    const cls = isUrgent ? 'feedback urgent' : (sb.cls === 'pos' ? 'feedback positive' : 'feedback');

    const div = document.createElement('div');
    div.className = cls;

    const flagsHtml = [];
    if (item.pii_removed) flagsHtml.push('개인정보 가림');
    if (item.profanity_removed) flagsHtml.push('욕설 가림');
    const flagsLine = flagsHtml.length ? `<div class="flags">${flagsHtml.join(' · ')}</div>` : '';

    const cats = (item.categories || []).filter(Boolean);
    const catsBadges = cats.map((c) => `<span class="badge low">${c}</span>`).join('');

    div.innerHTML = `
      <div class="meta">
        <span class="badge ${ub.cls}">${ub.label}</span>
        <span class="badge ${sb.cls}">${sb.label}</span>
        ${catsBadges}
        <span class="time">${formatTime(item.created_at)}</span>
      </div>
      <div class="body">${escapeHtml(item.content_clean)}</div>
      ${item.content_raw && item.content_raw !== item.content_clean ? `
        <button class="raw-toggle" data-id="${item.id}">정화 전 원본 보기</button>
        <div class="raw" id="raw-${item.id}">${escapeHtml(item.content_raw)}</div>
      ` : ''}
      ${flagsLine}
    `;

    const btn = div.querySelector('.raw-toggle');
    if (btn) {
      btn.addEventListener('click', () => {
        const raw = div.querySelector(`#raw-${item.id}`);
        raw.classList.toggle('show');
        btn.textContent = raw.classList.contains('show') ? '원본 숨기기' : '정화 전 원본 보기';
      });
    }

    return div;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, (m) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[m]);
  }

  async function loadDashboard() {
    try {
      const session = await getCurrentSession();
      if (!session) {
        showSection('signin-section');
        return;
      }

      $('#user-email').textContent = session.user.email;

      const [stores, feedback] = await Promise.all([
        fetchOwnerStores(),
        fetchOwnerFeedback(),
      ]);

      // 매장 정보
      const storesArea = $('#stores-area');
      if (stores.length === 0) {
        storesArea.innerHTML = `<div class="empty"><p>아직 등록된 매장이 없습니다.</p><p>voxpop 운영자에게 매장 등록을 문의해주세요.</p></div>`;
      } else {
        storesArea.innerHTML = stores.map((s) => {
          const myFeedback = feedback.filter((f) => f.stores?.id === s.id);
          return `
            <div class="store-info">
              <div>
                <div class="label">매장</div>
                <div class="name">${escapeHtml(s.display_name)}</div>
              </div>
              <div class="stats">
                받은 한마디 <b>${myFeedback.length}</b>개
              </div>
            </div>
          `;
        }).join('');
      }

      // 긴급 응답
      const urgent = feedback.filter((f) => f.urgency === 'high' || (f.sentiment_score != null && f.sentiment_score <= -0.5));
      $('#urgent-count').textContent = urgent.length ? `(${urgent.length})` : '';
      $('#urgent-badge').style.display = urgent.length ? '' : 'none';
      const urgentList = $('#urgent-list');
      urgentList.innerHTML = '';
      if (urgent.length === 0) {
        urgentList.innerHTML = `<div class="empty"><p>긴급한 한마디는 없어요.</p></div>`;
      } else {
        urgent.forEach((item) => urgentList.appendChild(renderFeedback(item)));
      }

      // 전체 응답
      $('#all-count').textContent = `(${feedback.length})`;
      const allList = $('#all-list');
      allList.innerHTML = '';
      if (feedback.length === 0) {
        allList.innerHTML = `<div class="empty"><p>아직 한마디가 도착하지 않았어요.</p><p>매장에 QR 코드를 비치하면 손님이 직접 남길 수 있어요.</p></div>`;
      } else {
        feedback.forEach((item) => allList.appendChild(renderFeedback(item)));
      }

      showSection('dashboard');
    } catch (err) {
      console.error('dashboard error', err);
      showSection('signin-section');
      showSigninNotice('대시보드를 불러오지 못했어요. 다시 로그인해주세요.', true);
    }
  }

  $('#signin-btn').addEventListener('click', async () => {
    const email = $('#email').value.trim();
    if (!email || !email.includes('@')) {
      showSigninNotice('올바른 이메일 주소를 입력해주세요.', true);
      return;
    }
    try {
      const redirectTo = location.origin + location.pathname;
      await sendMagicLink(email, redirectTo);
      showSigninNotice('로그인 링크를 보냈어요. 이메일을 확인해주세요.', false);
    } catch (err) {
      console.error('magic link error', err);
      showSigninNotice('로그인 링크 발송 실패. 잠시 후 다시 시도해주세요.', true);
    }
  });

  $('#signout-btn').addEventListener('click', async () => {
    await signOut();
    location.reload();
  });

  loadDashboard();
</script>
</body>
</html>
