<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>voxpop — 관리자</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root {
    --ink: #1f2430;
    --paper: #f6f3ec;
    --muted: #6b7180;
    --line: #d9d4c7;
    --accent: #2f6f6b;
    --acl: #38807b;
    --alert: #b0683a;
    --card: #fffdf8;
    --s2: #f1ede2;
    --canvas: #ece8dc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--canvas);
    color: var(--ink);
    line-height: 1.6;
    word-break: keep-all;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 24px 80px; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 28px;
  }
  h1 { font-size: 18px; margin: 0; }
  .signout {
    background: none; border: 1px solid var(--line);
    color: var(--muted); padding: 6px 12px;
    border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer;
  }

  .signin {
    max-width: 380px; margin: 60px auto;
    background: var(--paper); border-radius: 12px;
    padding: 32px 26px;
    box-shadow: 0 2px 16px rgba(31, 36, 48, 0.08);
  }
  .signin h2 { font-size: 20px; margin: 0 0 8px; }
  .signin p { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  .signin input, .form-row input {
    width: 100%; padding: 11px 14px;
    border: 1px solid var(--line); border-radius: 8px;
    font-family: inherit; font-size: 14px;
    background: var(--card);
  }
  .signin input:focus, .form-row input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  .btn {
    background: var(--accent); color: var(--paper); border: none;
    padding: 11px 16px; border-radius: 8px;
    font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { background: var(--acl); }
  .btn.full { width: 100%; margin-top: 10px; }
  .btn.danger { background: var(--alert); }
  .btn.outline {
    background: none; color: var(--accent);
    border: 1px solid var(--accent);
  }
  .btn.outline:hover { background: var(--accent); color: var(--paper); }

  h2.sec { font-size: 15px; margin: 24px 0 12px; font-weight: 700; }

  /* 매장 등록 폼 */
  .add-store {
    background: var(--paper); border-radius: 10px;
    padding: 22px 24px; margin-bottom: 28px;
  }
  .form-row { margin-bottom: 12px; }
  .form-row label {
    display: block; font-size: 12px;
    color: var(--muted); font-weight: 600;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .form-row .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* 매장 목록 */
  .store-row {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 14px 18px; margin-bottom: 10px;
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    gap: 12px;
    align-items: center;
  }
  .store-row.inactive { opacity: 0.55; }
  .store-row .slug {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
  }
  .store-row .name { font-size: 14px; font-weight: 600; margin-top: 2px; }
  .store-row .email { font-size: 12px; color: var(--muted); }
  .store-row .qr-link {
    font-size: 11px; color: var(--accent);
    text-decoration: none;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }
  .store-row .qr-link:hover { text-decoration: underline; }
  .store-row .toggle {
    background: none; border: 1px solid var(--line);
    color: var(--muted); padding: 5px 10px;
    border-radius: 4px; font-size: 11px; cursor: pointer;
  }
  .store-row .toggle:hover { color: var(--ink); }
  .store-row .toggle.on { background: var(--accent); color: var(--paper); border-color: var(--accent); }

  .empty {
    background: var(--paper); border-radius: 10px;
    padding: 36px 20px; text-align: center;
    color: var(--muted); font-size: 14px;
  }

  .notice {
    padding: 10px 14px; border-radius: 6px;
    font-size: 13px; margin-bottom: 12px;
  }
  .notice.success { background: var(--accent); color: var(--paper); }
  .notice.error { background: var(--alert); color: var(--paper); }
  .notice.info { background: var(--s2); color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">

  <div id="loading" class="empty">잠시만 기다려주세요...</div>

  <div id="signin-section" class="signin" style="display:none">
    <h2>관리자 로그인</h2>
    <p>등록된 관리자 이메일로 Magic Link를 받습니다.</p>
    <input type="email" id="email" placeholder="admin@example.com" />
    <button class="btn full" id="signin-btn">로그인 링크 받기</button>
    <div id="signin-notice" style="display:none"></div>
  </div>

  <div id="dashboard" style="display:none">
    <header>
      <h1>voxpop 관리자</h1>
      <button class="signout" id="signout-btn">로그아웃</button>
    </header>

    <div id="notice" style="display:none"></div>

    <div class="add-store">
      <h2 class="sec" style="margin-top:0">새 매장 등록</h2>
      <div class="form-row">
        <label>매장 slug (URL 식별자)</label>
        <input type="text" id="slug" placeholder="hanheejung" />
        <div class="hint">영문 소문자, 숫자, 하이픈만. 2~32자.</div>
      </div>
      <div class="form-row">
        <label>매장 표시명</label>
        <input type="text" id="display-name" placeholder="한희정 매장" />
      </div>
      <div class="form-row">
        <label>사장님 이메일</label>
        <input type="email" id="owner-email" placeholder="owner@example.com" />
        <div class="hint">사장님이 본 이메일로 대시보드 로그인.</div>
      </div>
      <div class="form-row">
        <label>사장님 표시 이름 (선택)</label>
        <input type="text" id="owner-label" placeholder="한희정 사장님" />
      </div>
      <button class="btn full" id="add-btn">매장 등록</button>
    </div>

    <h2 class="sec">매장 목록 <span id="store-count" style="font-weight:400;font-size:12px;color:var(--muted)"></span></h2>
    <div id="store-list"></div>

    <div class="empty" style="margin-top:20px;font-size:12px">
      QR 코드 생성: <code style="background:var(--s2);padding:2px 6px;border-radius:3px">node scripts/generate-qr.mjs &lt;slug&gt;</code>
    </div>
  </div>

</div>

<script type="module">
  import {
    sendMagicLink,
    getCurrentSession,
    signOut,
    fetchOwnerStores,
    insertStore,
    toggleStoreActive,
  } from '../lib/supabase-client.js';
  import { ADMIN_EMAILS } from '../lib/config.js';

  const $ = (sel) => document.querySelector(sel);

  function show(id) {
    ['loading', 'signin-section', 'dashboard'].forEach((s) => {
      $(`#${s}`).style.display = (s === id) ? '' : 'none';
    });
  }

  function notice(message, kind) {
    const el = $('#notice');
    el.className = `notice ${kind}`;
    el.textContent = message;
    el.style.display = '';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }

  function signinNotice(message, isError) {
    const el = $('#signin-notice');
    el.className = isError ? 'notice error' : 'notice success';
    el.textContent = message;
    el.style.display = '';
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, (m) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[m]);
  }

  function buildStoreUrl(slug) {
    return `${location.origin}${location.pathname.replace(/\/admin\/?$/, '')}/s/?store=${slug}`;
  }

  function renderStoreRow(s) {
    const row = document.createElement('div');
    row.className = 's' === 's' ? `store-row ${s.active ? '' : 'inactive'}` : '';
    const storeUrl = buildStoreUrl(s.slug);
    row.innerHTML = `
      <div>
        <div class="slug">${escapeHtml(s.slug)}</div>
        <div class="name">${escapeHtml(s.display_name)}</div>
        <div class="email">${escapeHtml(s.owner_label || '')} · ${escapeHtml(s.owner_email || '')}</div>
      </div>
      <a class="qr-link" href="${storeUrl}" target="_blank">URL 열기</a>
      <button class="toggle ${s.active ? 'on' : ''}" data-id="${s.id}" data-active="${s.active}">
        ${s.active ? '활성' : '비활성'}
      </button>
    `;
    const toggleBtn = row.querySelector('.toggle');
    toggleBtn.addEventListener('click', async () => {
      const next = !s.active;
      try {
        await toggleStoreActive(s.id, next);
        notice(`${s.display_name} ${next ? '활성화' : '비활성화'} 완료`, 'success');
        await loadStores();
      } catch (err) {
        notice('상태 변경 실패: ' + err.message, 'error');
      }
    });
    return row;
  }

  async function loadStores() {
    try {
      const stores = await fetchOwnerStores();
      $('#store-count').textContent = stores.length ? `(${stores.length})` : '';
      const list = $('#store-list');
      list.innerHTML = '';
      if (stores.length === 0) {
        list.innerHTML = `<div class="empty">아직 등록된 매장이 없습니다. 위 폼에서 첫 매장을 등록하세요.</div>`;
      } else {
        stores.forEach((s) => list.appendChild(renderStoreRow(s)));
      }
    } catch (err) {
      console.error('load stores error', err);
      notice('매장 목록을 불러오지 못했어요: ' + err.message, 'error');
    }
  }

  async function init() {
    const session = await getCurrentSession();
    if (!session) {
      show('signin-section');
      return;
    }
    if (!ADMIN_EMAILS.includes(session.user.email)) {
      show('signin-section');
      signinNotice('등록된 관리자가 아닙니다.', true);
      return;
    }
    show('dashboard');
    await loadStores();
  }

  $('#signin-btn').addEventListener('click', async () => {
    const email = $('#email').value.trim();
    if (!email || !email.includes('@')) {
      signinNotice('이메일을 정확히 입력해주세요.', true);
      return;
    }
    if (!ADMIN_EMAILS.includes(email)) {
      signinNotice('등록된 관리자 이메일이 아닙니다. lib/config.js의 ADMIN_EMAILS를 확인하세요.', true);
      return;
    }
    try {
      await sendMagicLink(email, location.origin + location.pathname);
      signinNotice('로그인 링크를 보냈어요. 이메일을 확인해주세요.', false);
    } catch (err) {
      signinNotice('발송 실패: ' + err.message, true);
    }
  });

  $('#signout-btn').addEventListener('click', async () => {
    await signOut();
    location.reload();
  });

  $('#add-btn').addEventListener('click', async () => {
    const slug = $('#slug').value.trim();
    const display_name = $('#display-name').value.trim();
    const owner_email = $('#owner-email').value.trim();
    const owner_label = $('#owner-label').value.trim() || null;

    if (!/^[a-z0-9-]{2,32}$/.test(slug)) {
      notice('slug는 영문 소문자, 숫자, 하이픈만 가능합니다 (2~32자).', 'error');
      return;
    }
    if (!display_name) { notice('매장 표시명을 입력하세요.', 'error'); return; }
    if (!owner_email.includes('@')) { notice('사장님 이메일을 입력하세요.', 'error'); return; }

    try {
      await insertStore({ slug, display_name, owner_email, owner_label });
      notice(`${display_name} 등록 완료. QR 생성: node scripts/generate-qr.mjs ${slug}`, 'success');
      $('#slug').value = '';
      $('#display-name').value = '';
      $('#owner-email').value = '';
      $('#owner-label').value = '';
      await loadStores();
    } catch (err) {
      notice('등록 실패: ' + err.message, 'error');
    }
  });

  init();
</script>
</body>
</html>
