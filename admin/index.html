<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>voxpop — 관리자</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="theme-color" content="#2f6f6b" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<style>
  :root {
    --ink: #1f2430;
    --paper: #f6f3ec;
    --muted: #646a78;
    --line: #d9d4c7;
    --accent: #2f6f6b;
    --acl: #38807b;
    --alert: #9c5a30;
    --card: #fffdf8;
    --s2: #f1ede2;
    --canvas: #ece8dc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--canvas);
    color: var(--ink);
    line-height: 1.6;
    word-break: keep-all;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 24px 80px; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 28px;
  }
  h1 { font-size: 18px; margin: 0; }
  .signout {
    background: none; border: 1px solid var(--line);
    color: var(--muted); padding: 6px 12px;
    border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer;
  }

  .signin {
    max-width: 380px; margin: 60px auto;
    background: var(--paper); border-radius: 12px;
    padding: 32px 26px;
    box-shadow: 0 2px 16px rgba(31, 36, 48, 0.08);
  }
  .signin h2 { font-size: 20px; margin: 0 0 8px; }
  .signin p { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  .signin input, .form-row input {
    width: 100%; padding: 11px 14px;
    border: 1px solid var(--line); border-radius: 8px;
    font-family: inherit; font-size: 14px;
    background: var(--card);
  }
  .signin input:focus, .form-row input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  .btn {
    background: var(--accent); color: var(--paper); border: none;
    padding: 11px 16px; border-radius: 8px;
    font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { background: var(--acl); }
  .btn.full { width: 100%; margin-top: 10px; }
  .btn.danger { background: var(--alert); }
  .btn.outline {
    background: none; color: var(--accent);
    border: 1px solid var(--accent);
  }
  .btn.outline:hover { background: var(--accent); color: var(--paper); }
  .btn.sm {
    padding: 5px 10px; font-size: 12px; font-weight: 500;
    border-radius: 4px;
  }

  h2.sec { font-size: 15px; margin: 24px 0 12px; font-weight: 700; }

  /* 매장 등록 폼 */
  .add-store {
    background: var(--paper); border-radius: 10px;
    padding: 22px 24px; margin-bottom: 28px;
  }
  .form-row { margin-bottom: 12px; }
  .form-row label {
    display: block; font-size: 12px;
    color: var(--muted); font-weight: 600;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .form-row .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* slug 자동 생성 미리보기 */
  .slug-preview {
    background: var(--s2); border-radius: 6px;
    padding: 10px 14px; font-size: 13px;
    color: var(--ink); margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .slug-preview code {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-weight: 700; color: var(--accent); font-size: 13px;
  }
  .slug-preview .label { font-size: 11px; color: var(--muted); }

  /* 매장 목록 */
  .store-row {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 14px 18px; margin-bottom: 10px;
    display: grid;
    grid-template-columns: 1fr auto auto auto auto;
    gap: 12px;
    align-items: center;
  }
  .store-row.inactive { opacity: 0.55; }
  .store-row .slug {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
  }
  .store-row .name { font-size: 14px; font-weight: 600; margin-top: 2px; }
  .store-row .email { font-size: 12px; color: var(--muted); }
  .store-row .qr-link {
    font-size: 11px; color: var(--accent);
    text-decoration: none;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }
  .store-row .qr-link:hover { text-decoration: underline; }
  .store-row .toggle {
    background: none; border: 1px solid var(--line);
    color: var(--muted); padding: 5px 10px;
    border-radius: 4px; font-size: 11px; cursor: pointer;
  }
  .store-row .toggle:hover { color: var(--ink); }
  .store-row .toggle.on { background: var(--accent); color: var(--paper); border-color: var(--accent); }

  .empty {
    background: var(--paper); border-radius: 10px;
    padding: 36px 20px; text-align: center;
    color: var(--muted); font-size: 14px;
  }

  .notice {
    padding: 10px 14px; border-radius: 6px;
    font-size: 13px; margin-bottom: 12px;
  }
  .notice.success { background: var(--accent); color: var(--paper); }
  .notice.error { background: var(--alert); color: var(--paper); }
  .notice.info { background: var(--s2); color: var(--ink); }

  /* ── 검수 화면 (ADM-03) ─────────────────── */
  .review-section {
    margin-top: 40px;
    border-top: 2px solid var(--line);
    padding-top: 28px;
  }
  .review-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .review-header h2 { margin: 0; }
  .review-store-select {
    padding: 8px 12px; border: 1px solid var(--line);
    border-radius: 6px; font-family: inherit; font-size: 13px;
    background: var(--card); color: var(--ink); cursor: pointer;
  }
  .review-store-select:focus { outline: 2px solid var(--accent); }
  .review-stats {
    font-size: 12px; color: var(--muted);
    background: var(--s2); padding: 6px 12px;
    border-radius: 6px; margin-bottom: 14px;
  }

  .review-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px 18px; margin-bottom: 14px;
  }
  .review-card.urgent { border-left: 4px solid var(--alert); }
  .review-card-meta {
    display: flex; gap: 8px; align-items: center;
    flex-wrap: wrap; margin-bottom: 8px;
  }
  .badge {
    font-size: 10px; padding: 2px 7px; border-radius: 99px;
    font-weight: 700; letter-spacing: 0.04em;
  }
  .badge.urgent { background: var(--alert); color: var(--paper); }
  .badge.held { background: #7b4a2b; color: var(--paper); }
  .badge.sanitized { background: var(--accent); color: var(--paper); }
  .badge.visible { background: var(--s2); color: var(--ink); }
  .badge.unreviewed { background: var(--line); color: var(--ink); }
  .badge.accurate { background: #2a7b43; color: var(--paper); }
  .badge.over { background: #7b6a2a; color: var(--paper); }
  .badge.under { background: var(--alert); color: var(--paper); }

  .review-content { margin: 8px 0; }
  .review-clean {
    background: var(--s2); border-radius: 6px;
    padding: 10px 14px; font-size: 14px; margin-bottom: 8px;
  }
  .review-raw-box {
    background: #fff8f0; border: 1px solid #f0d0b0;
    border-radius: 6px; padding: 10px 14px;
    font-size: 13px; color: #7b3a1a;
    margin-bottom: 8px; display: none;
  }
  .review-raw-box .raw-warning {
    font-size: 10px; font-weight: 700;
    color: var(--alert); margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .review-types {
    font-size: 11px; color: var(--muted);
    margin-bottom: 8px;
  }

  .review-flags {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-top: 10px;
  }
  .flag-btn {
    padding: 4px 10px; border-radius: 99px;
    font-size: 11px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--line);
    background: none; color: var(--muted);
    font-family: inherit;
    transition: background 0.1s, color 0.1s;
  }
  .flag-btn:hover { border-color: var(--accent); color: var(--accent); }
  .flag-btn.active-accurate { background: #2a7b43; color: white; border-color: #2a7b43; }
  .flag-btn.active-over { background: #7b6a2a; color: white; border-color: #7b6a2a; }
  .flag-btn.active-under { background: var(--alert); color: white; border-color: var(--alert); }

  .review-card-meta time { font-size: 11px; color: var(--muted); }

  .review-access-denied {
    background: var(--paper); border-radius: 10px;
    padding: 28px 20px; text-align: center;
    color: var(--alert); font-size: 14px; font-weight: 600;
    border: 1px solid #f0d0b0;
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="loading" class="empty">잠시만 기다려주세요...</div>

  <div id="signin-section" class="signin" style="display:none">
    <h2>관리자 로그인</h2>
    <p>등록된 관리자 이메일로 Magic Link를 받습니다.</p>
    <input type="email" id="email" placeholder="admin@example.com" />
    <button class="btn full" id="signin-btn">로그인 링크 받기</button>
    <div id="signin-notice" style="display:none"></div>
  </div>

  <div id="dashboard" style="display:none">
    <header>
      <h1>voxpop 관리자</h1>
      <button class="signout" id="signout-btn">로그아웃</button>
    </header>

    <div id="notice" style="display:none"></div>

    <!-- 새 매장 등록 (ADM-02: slug random 강제) -->
    <div class="add-store">
      <h2 class="sec" style="margin-top:0">새 매장 등록</h2>

      <!-- slug 자동 생성 미리보기 -->
      <div class="slug-preview">
        <div>
          <div class="label">자동 생성 — 익명성 보호</div>
          <div>slug: <code id="slug-preview-value">—</code></div>
        </div>
        <button class="btn outline sm" type="button" id="regen-slug-btn">다시 생성</button>
      </div>

      <div class="form-row">
        <label>매장 표시명</label>
        <input type="text" id="display-name" placeholder="모닝브루 카페" />
      </div>
      <div class="form-row">
        <label>사장님 이메일</label>
        <input type="email" id="owner-email" placeholder="owner@example.com" />
        <div class="hint">사장님이 본 이메일로 대시보드 로그인.</div>
      </div>
      <div class="form-row">
        <label>사장님 표시 이름 (선택)</label>
        <input type="text" id="owner-label" placeholder="홍길동 사장님" />
      </div>
      <button class="btn full" id="add-btn">매장 등록</button>
    </div>

    <h2 class="sec">매장 목록 <span id="store-count" style="font-weight:400;font-size:12px;color:var(--muted)"></span></h2>
    <div id="store-list"></div>

    <!-- 검수 화면 (ADM-03) -->
    <div class="review-section" id="review-section">
      <div class="review-header">
        <h2 class="sec" style="margin:0">검수 화면</h2>
        <select class="review-store-select" id="review-store-select">
          <option value="">매장 선택...</option>
        </select>
        <button class="btn outline sm" id="review-load-btn">불러오기</button>
      </div>
      <div id="review-body">
        <div class="empty" style="padding:24px">매장을 선택하고 불러오기를 눌러주세요.</div>
      </div>
    </div>

  </div>

</div>

<script type="module">
  import {
    sendMagicLink,
    getCurrentSession,
    signOut,
    fetchOwnerStores,
    insertStore,
    toggleStoreActive,
    fetchOwnerFeedback,
    fetchFeedbackRaw,
  } from '../lib/supabase-client.js';
  import { ADMIN_EMAILS } from '../lib/config.js';
  import { REVIEW_FLAG, REVIEW_FLAG_LABEL, maskedTypes, triageSort } from '../lib/review-engine.js';

  const $ = (sel) => document.querySelector(sel);

  // ── 유틸 ────────────────────────────────────────────────────
  function show(id) {
    ['loading', 'signin-section', 'dashboard'].forEach((s) => {
      $(`#${s}`).style.display = (s === id) ? '' : 'none';
    });
  }

  function notice(message, kind) {
    const el = $('#notice');
    el.className = `notice ${kind}`;
    el.textContent = message;
    el.style.display = '';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }

  function signinNotice(message, isError) {
    const el = $('#signin-notice');
    el.className = isError ? 'notice error' : 'notice success';
    el.textContent = message;
    el.style.display = '';
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, (m) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[m]);
  }

  function buildStoreUrl(slug) {
    return `${location.origin}${location.pathname.replace(/\/admin\/?$/, '')}/s/?store=${slug}`;
  }

  // ── slug 자동 생성 (crypto.getRandomValues, 8자 a-z0-9) ────
  function generateSlug() {
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    const arr = new Uint8Array(8);
    crypto.getRandomValues(arr);
    return Array.from(arr, (b) => chars[b % chars.length]).join('');
  }

  let _currentSlug = generateSlug();

  function refreshSlugPreview() {
    _currentSlug = generateSlug();
    $('#slug-preview-value').textContent = _currentSlug;
  }

  // 페이지 로드 시 첫 slug 미리보기 표시
  function initSlugPreview() {
    $('#slug-preview-value').textContent = _currentSlug;
    $('#regen-slug-btn').addEventListener('click', () => refreshSlugPreview());
  }

  // ── QR 다운로드 (PNG 800px, dark #1f2430, light #f6f3ec) ───
  async function downloadQR(slug) {
    const url = buildStoreUrl(slug);
    const canvas = document.createElement('canvas');
    canvas.width = 800;
    canvas.height = 800;

    await new Promise((resolve, reject) => {
      QRCode.toCanvas(canvas, url, {
        width: 800,
        margin: 2,
        color: {
          dark: '#1f2430',
          light: '#f6f3ec',
        },
        errorCorrectionLevel: 'M',
      }, (err) => {
        if (err) reject(err);
        else resolve();
      });
    });

    canvas.toBlob((blob) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `voxpop-qr-${slug}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  }

  // ── 매장 목록 행 렌더 ───────────────────────────────────────
  function renderStoreRow(s) {
    const row = document.createElement('div');
    row.className = `store-row ${s.active ? '' : 'inactive'}`;
    const storeUrl = buildStoreUrl(s.slug);
    row.innerHTML = `
      <div>
        <div class="slug">${escapeHtml(s.slug)}</div>
        <div class="name">${escapeHtml(s.display_name)}</div>
        <div class="email">${escapeHtml(s.owner_label || '')} · ${escapeHtml(s.owner_email || '')}</div>
      </div>
      <a class="qr-link" href="${storeUrl}" target="_blank">URL 열기</a>
      <button class="btn outline sm qr-dl-btn" data-slug="${escapeHtml(s.slug)}">QR 다운로드(PNG)</button>
      <button class="toggle ${s.active ? 'on' : ''}" data-id="${s.id}" data-active="${s.active}">
        ${s.active ? '활성' : '비활성'}
      </button>
    `;

    // QR 다운로드
    row.querySelector('.qr-dl-btn').addEventListener('click', async () => {
      try {
        await downloadQR(s.slug);
      } catch (err) {
        notice('QR 생성 실패: ' + err.message, 'error');
      }
    });

    // 활성 토글
    const toggleBtn = row.querySelector('.toggle');
    toggleBtn.addEventListener('click', async () => {
      const next = !s.active;
      try {
        await toggleStoreActive(s.id, next);
        notice(`${s.display_name} ${next ? '활성화' : '비활성화'} 완료`, 'success');
        await loadStores();
      } catch (err) {
        notice('상태 변경 실패: ' + err.message, 'error');
      }
    });
    return row;
  }

  async function loadStores() {
    try {
      const stores = await fetchOwnerStores();
      $('#store-count').textContent = stores.length ? `(${stores.length})` : '';
      const list = $('#store-list');
      list.innerHTML = '';
      if (stores.length === 0) {
        list.innerHTML = `<div class="empty">아직 등록된 매장이 없습니다. 위 폼에서 첫 매장을 등록하세요.</div>`;
      } else {
        stores.forEach((s) => list.appendChild(renderStoreRow(s)));
      }
      // 검수 화면 매장 드롭다운도 갱신
      updateReviewStoreSelect(stores);
    } catch (err) {
      console.error('load stores error', err);
      notice('매장 목록을 불러오지 못했어요: ' + err.message, 'error');
    }
  }

  // ── 검수 화면 (ADM-03) ──────────────────────────────────────

  // 검수 결과 메모리 저장 (오탐 플래그: id→flag)
  const _reviewFlags = {};

  function updateReviewStoreSelect(stores) {
    const sel = $('#review-store-select');
    const cur = sel.value;
    // 기존 옵션 초기화 후 재구성
    sel.innerHTML = '<option value="">매장 선택...</option>';
    stores.forEach((s) => {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = `${s.display_name} (${s.slug})`;
      if (opt.value === cur) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  function badgeClass(exposureStatus) {
    if (!exposureStatus) return 'visible';
    if (exposureStatus === '정상 노출') return 'visible';
    if (exposureStatus === '가림 후 표시') return 'sanitized';
    if (exposureStatus === '민감 보류') return 'held';
    if (exposureStatus === '스팸 제외') return 'unreviewed';
    return 'visible';
  }

  function flagBtnClass(flag) {
    if (flag === REVIEW_FLAG.ACCURATE) return 'active-accurate';
    if (flag === REVIEW_FLAG.OVER) return 'active-over';
    if (flag === REVIEW_FLAG.UNDER) return 'active-under';
    return '';
  }

  function renderReviewCard(item, isAdmin) {
    const card = document.createElement('div');
    const isUrgent = item.urgent;
    card.className = `review-card${isUrgent ? ' urgent' : ''}`;
    card.dataset.feedbackId = item.id;

    const currentFlag = _reviewFlags[item.id] ?? item.reviewFlag ?? REVIEW_FLAG.UNREVIEWED;
    const flagLabel = REVIEW_FLAG_LABEL[currentFlag] ?? '미검수';
    const expStatus = item.exposureStatus ?? '정상 노출';

    // 처리 유형 태그
    const types = item.maskedTypes ?? [];

    // 제출 시각 포맷
    const submittedAt = item.created_at
      ? new Date(item.created_at).toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
      : '';

    card.innerHTML = `
      <div class="review-card-meta">
        ${isUrgent ? '<span class="badge urgent">긴급</span>' : ''}
        <span class="badge ${badgeClass(expStatus)}">${escapeHtml(expStatus)}</span>
        <span class="badge ${currentFlag}">${escapeHtml(flagLabel)}</span>
        ${item.categories?.length ? `<span class="badge visible">${escapeHtml(item.categories.join('·'))}</span>` : ''}
        <time>${escapeHtml(submittedAt)}</time>
      </div>
      <div class="review-content">
        <div class="review-clean"><strong>가림본</strong>: ${escapeHtml(item.content_clean ?? '(없음)')}</div>
        <div class="review-raw-box" id="raw-box-${escapeHtml(item.id)}">
          <div class="raw-warning">운영자 전용 — 외부 공유 금지</div>
          <div id="raw-text-${escapeHtml(item.id)}">불러오는 중...</div>
        </div>
        ${types.length ? `<div class="review-types">처리 유형: ${escapeHtml(types.join(', '))}</div>` : ''}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px">
        <button class="btn outline sm raw-toggle-btn" data-id="${escapeHtml(item.id)}" data-loaded="false">원본 보기</button>
        <div class="review-flags">
          <span style="font-size:11px;color:var(--muted);margin-right:2px">오탐 플래그:</span>
          <button class="flag-btn ${currentFlag === REVIEW_FLAG.ACCURATE ? 'active-accurate' : ''}" data-flag="${REVIEW_FLAG.ACCURATE}" data-id="${escapeHtml(item.id)}">가림 정확</button>
          <button class="flag-btn ${currentFlag === REVIEW_FLAG.OVER ? 'active-over' : ''}" data-flag="${REVIEW_FLAG.OVER}" data-id="${escapeHtml(item.id)}">과가림</button>
          <button class="flag-btn ${currentFlag === REVIEW_FLAG.UNDER ? 'active-under' : ''}" data-flag="${REVIEW_FLAG.UNDER}" data-id="${escapeHtml(item.id)}">미가림</button>
        </div>
      </div>
    `;

    // 원본 보기 토글 (fetchFeedbackRaw — admin RLS만 통과)
    const rawToggle = card.querySelector('.raw-toggle-btn');
    rawToggle.addEventListener('click', async () => {
      const rawBox = card.querySelector(`#raw-box-${item.id}`);
      const rawText = card.querySelector(`#raw-text-${item.id}`);
      const loaded = rawToggle.dataset.loaded === 'true';
      const visible = rawBox.style.display !== 'none' && rawBox.style.display !== '';

      if (visible) {
        rawBox.style.display = 'none';
        rawToggle.textContent = '원본 보기';
        return;
      }

      rawBox.style.display = 'block';
      rawToggle.textContent = '원본 숨기기';

      if (!loaded) {
        try {
          const raw = await fetchFeedbackRaw(item.id);
          rawText.textContent = raw ?? '(원본 없음)';
          rawToggle.dataset.loaded = 'true';
        } catch (err) {
          rawText.textContent = '원본 로드 실패: ' + err.message;
        }
      }
    });

    // 오탐 플래그 버튼
    card.querySelectorAll('.flag-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const flag = btn.dataset.flag;
        const id = btn.dataset.id;
        _reviewFlags[id] = flag;

        // 같은 카드 내 모든 flag-btn 스타일 초기화 후 활성 표시
        card.querySelectorAll('.flag-btn').forEach((b) => {
          b.className = `flag-btn ${b.dataset.flag === flag ? flagBtnClass(flag) : ''}`;
        });
        // 플래그 배지 갱신
        const flagBadge = card.querySelector(`.badge.${Object.values(REVIEW_FLAG).find((f) => f === currentFlag) || REVIEW_FLAG.UNREVIEWED}`);
        // 헤더 badge 교체
        card.querySelector('.review-card-meta').querySelectorAll('.badge').forEach((b) => {
          if (Object.values(REVIEW_FLAG).includes(b.textContent.trim()) ||
              Object.values(REVIEW_FLAG_LABEL).includes(b.textContent.trim())) {
            b.textContent = REVIEW_FLAG_LABEL[flag] ?? flag;
            b.className = `badge ${flag}`;
          }
        });
      });
    });

    return card;
  }

  async function loadReviewFeedback(isAdmin) {
    const storeId = $('#review-store-select').value;
    if (!storeId) {
      notice('매장을 선택해주세요.', 'info');
      return;
    }
    const body = $('#review-body');
    body.innerHTML = '<div class="empty" style="padding:20px">불러오는 중...</div>';

    try {
      // fetchOwnerFeedback은 feedback_owner_view에서 가져옴 — content_raw 미포함, admin 안전
      const allFeedback = await fetchOwnerFeedback();
      const storeFeedback = allFeedback.filter((f) => f.store_id === storeId);

      if (storeFeedback.length === 0) {
        body.innerHTML = '<div class="empty" style="padding:20px">이 매장에 아직 한마디가 없습니다.</div>';
        return;
      }

      // reviewEngine triageSort 형식에 맞게 변환
      // feedback_owner_view 데이터 → 검수 아이템 형식 (reviewEngine.buildReviewItem과 호환)
      const reviewItems = storeFeedback.map((f) => ({
        id: f.id,
        storeId: f.store_id,
        submittedAt: f.created_at,
        content_clean: f.content_clean,
        exposureStatus: f.urgency === 'high' ? '민감 보류'
          : (f.pii_removed || f.profanity_removed) ? '가림 후 표시'
          : '정상 노출',
        urgent: f.urgency === 'high',
        categories: f.categories ?? [],
        pii_removed: f.pii_removed,
        profanity_removed: f.profanity_removed,
        maskedTypes: [
          ...(f.pii_removed ? ['개인정보'] : []),
          ...(f.profanity_removed ? ['욕설'] : []),
        ],
        reviewFlag: _reviewFlags[f.id] ?? REVIEW_FLAG.UNREVIEWED,
        changed: f.pii_removed || f.profanity_removed,
      }));

      // triageSort: 미검수 먼저 → 긴급 → 최신순
      const sorted = triageSort(reviewItems);

      // 통계
      const total = sorted.length;
      const unreviewed = sorted.filter((i) => (_reviewFlags[i.id] ?? REVIEW_FLAG.UNREVIEWED) === REVIEW_FLAG.UNREVIEWED).length;
      const urgent = sorted.filter((i) => i.urgent).length;

      body.innerHTML = '';

      const stats = document.createElement('div');
      stats.className = 'review-stats';
      stats.textContent = `전체 ${total}건 | 미검수 ${unreviewed}건 | 긴급 ${urgent}건`;
      body.appendChild(stats);

      sorted.forEach((item) => {
        body.appendChild(renderReviewCard(item, isAdmin));
      });

    } catch (err) {
      body.innerHTML = `<div class="empty" style="padding:20px;color:var(--alert)">불러오기 실패: ${escapeHtml(err.message)}</div>`;
    }
  }

  // ── 초기화 ───────────────────────────────────────────────────
  async function init() {
    initSlugPreview();

    const session = await getCurrentSession();
    if (!session) {
      show('signin-section');
      return;
    }
    if (!ADMIN_EMAILS.includes(session.user.email)) {
      show('signin-section');
      signinNotice('등록된 관리자가 아닙니다.', true);
      return;
    }

    const isAdmin = ADMIN_EMAILS.includes(session.user.email);
    show('dashboard');
    await loadStores();

    // 검수 섹션 — 인증 확인 후 표시
    const reviewSection = $('#review-section');
    if (!isAdmin) {
      reviewSection.innerHTML = '<div class="review-access-denied">관리자 인증이 필요합니다. 검수 화면은 운영자 전용입니다.</div>';
    } else {
      $('#review-load-btn').addEventListener('click', () => loadReviewFeedback(isAdmin));
    }
  }

  // ── 이벤트 ───────────────────────────────────────────────────
  $('#signin-btn').addEventListener('click', async () => {
    const email = $('#email').value.trim();
    if (!email || !email.includes('@')) {
      signinNotice('이메일을 정확히 입력해주세요.', true);
      return;
    }
    if (!ADMIN_EMAILS.includes(email)) {
      signinNotice('등록된 관리자 이메일이 아닙니다. lib/config.js의 ADMIN_EMAILS를 확인하세요.', true);
      return;
    }
    try {
      await sendMagicLink(email, location.origin + location.pathname);
      signinNotice('로그인 링크를 보냈어요. 이메일을 확인해주세요.', false);
    } catch (err) {
      signinNotice('발송 실패: ' + err.message, true);
    }
  });

  $('#signout-btn').addEventListener('click', async () => {
    await signOut();
    location.reload();
  });

  $('#add-btn').addEventListener('click', async () => {
    // slug는 자동 생성된 _currentSlug 사용 (직접 입력 폐지)
    const slug = _currentSlug;
    const display_name = $('#display-name').value.trim();
    const owner_email = $('#owner-email').value.trim();
    const owner_label = $('#owner-label').value.trim() || null;

    if (!display_name) { notice('매장 표시명을 입력하세요.', 'error'); return; }
    if (!owner_email.includes('@')) { notice('사장님 이메일을 입력하세요.', 'error'); return; }

    try {
      const stored = await insertStore({ slug, display_name, owner_email, owner_label });
      const storedSlug = stored?.slug ?? slug;

      // 등록 성공 후 QR 다운로드 안내 + 즉시 생성
      notice(`${display_name} 등록 완료. QR을 다운로드하세요.`, 'success');

      // 자동 QR 다운로드 (등록 즉시)
      try {
        await downloadQR(storedSlug);
      } catch {
        // QR 자동 다운로드 실패는 조용히 — 목록 행 버튼으로 재시도 가능
      }

      // 폼 초기화 + 새 slug 생성
      $('#display-name').value = '';
      $('#owner-email').value = '';
      $('#owner-label').value = '';
      refreshSlugPreview();

      await loadStores();
    } catch (err) {
      notice('등록 실패: ' + err.message, 'error');
    }
  });

  init();
</script>
</body>
</html>
