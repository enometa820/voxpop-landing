name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # GH Pages는 정적 파일만 서빙 → 실제 라우트 경로마다 앱 셸(index.html)을 두어 200으로 서빙.
      # 각 라우트 디렉토리에 index.html을 두면 /s/?store=·/owner/ 등이 정상 200. 그 외 미지정 경로는 404.html(앱 셸)이 받아 React NotFound로.
      - run: |
          cp dist/index.html dist/404.html
          for r in s owner admin story privacy owner-guide thread; do
            mkdir -p "dist/$r"
            cp dist/index.html "dist/$r/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
